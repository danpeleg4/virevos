name: transcript-lambda
on:
  push:
    branches:
      - main
    paths:
      - "transcript-lambda/**"
      - ".github/workflows/transcript-lambda.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Build lambda
        run: |
          cd transcript-lambda
          npm run build

      - name: Zip lambda
        run: |
          cd transcript-lambda/dist
          zip -r ../function.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TRANSCRIPT }}

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name virevos-vector-embed \
            --zip-file fileb://transcript-lambda/function.zip