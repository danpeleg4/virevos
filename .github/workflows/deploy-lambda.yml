name: deploy-lambda
on:
  push:
    paths:
      - "lambda/**"
      - ".github/workflows/deploy-lambda.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: |
          cd lambda
          npm install

      - name: Build lambda
        run: |
          cd lambda
          npm run build

      - name: Zip lambda
        run: |
          cd lambda/dist
          zip -r ../function.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name virevos-schedule-meeting \
            --zip-file fileb://lambda/function.zip